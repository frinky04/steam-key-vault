<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2838"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="key" gradientUnits="userSpaceOnUse" x1="10" y1="20" x2="54" y2="44">
      <stop offset="0" stop-color="#8fd6ff"/>
      <stop offset="1" stop-color="#1b9be0"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#66c0f4" stroke-opacity=".25" stroke-width="2"/>
  <!-- key: bow (ring) + shaft + bits, rotated 45° -->
  <g transform="rotate(-45 32 32)" fill="none" stroke="url(#key)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="32" r="8.5"/>
    <path d="M28.5 32H51"/>
    <path d="M45 32v7"/>
    <path d="M37.5 32v5.5"/>
  </g>
  <!-- keyhole highlight -->
  <circle cx="20" cy="32" r="2.4" transform="rotate(-45 32 32)" fill="#66c0f4"/>
</svg>
